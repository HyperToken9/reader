<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>05 — sync spike (THROWAWAY PROTOTYPE)</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div id="app">
      <aside id="side">
        <h1>05 — sync spike</h1>
        <p class="proto">Throwaway prototype. Not production code.</p>

        <section>
          <button id="pick">Choose a PDF…</button>
          <input id="file" type="file" accept="application/pdf" hidden />
          <div id="docinfo" class="muted">no document</div>
        </section>

        <section>
          <label>Voice
            <select id="voice"></select>
          </label>
          <label>Rate <output id="rateOut">1.00</output>
            <input id="rate" type="range" min="0.5" max="2" step="0.05" value="1" />
          </label>
          <label>Zoom <output id="zoomOut">1.20</output>
            <input id="zoom" type="range" min="0.5" max="3" step="0.1" value="1.2" />
          </label>
        </section>

        <section class="row">
          <button id="play">▶ Play</button>
          <button id="stop">■ Stop</button>
        </section>

        <section>
          <label class="check"><input id="autoscroll" type="checkbox" checked /> Auto-scroll</label>
          <label class="check"><input id="showall" type="checkbox" /> Show every sentence band</label>
        </section>

        <section>
          <h2>State</h2>
          <div id="state" class="state">idle</div>
          <div id="spoken" class="spoken">—</div>
        </section>

        <section class="grow">
          <h2>Segmentation <span id="segcount" class="muted"></span></h2>
          <p class="muted tiny">Every sentence <code>Intl.Segmenter</code> found on the page in view. Click one to speak from there.</p>
          <ol id="sentences"></ol>
        </section>
      </aside>

      <main id="viewer">
        <div id="pages"></div>
        <div id="drop">Drop a textbook PDF here</div>
      </main>
    </div>

    <div id="switcher">
      <button id="prevVariant" aria-label="Previous band style">←</button>
      <span id="variantLabel">A (Tint)</span>
      <button id="nextVariant" aria-label="Next band style">→</button>
    </div>

    <script type="module" src="./main.js"></script>
  </body>
</html>
